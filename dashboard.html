<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>D426 Curricular Sequencing Pilot — Live Operational Telemetry</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --wgu-blue: #002F6C;
      --wgu-blue-light: #0056B3;
      --wgu-gold: #BA8E23;
      --teal: #0D9488;
      --green: #16A34A;
      --red: #DC2626;
      --bg-slate: #F1F5F9;
      --card-bg: #FFFFFF;
      --text-main: #1E293B;
      --text-muted: #64748B;
      --border-color: #CBD5E1;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-slate);
      color: var(--text-main);
      line-height: 1.5;
      padding-bottom: 3.5rem;
    }

    .container {
      max-width: 1380px;
      margin: 1.25rem auto;
      padding: 0 1.25rem;
    }

    /* Top Executive Header */
    .exec-banner {
      background: linear-gradient(135deg, var(--wgu-blue) 0%, #001D44 100%);
      color: #FFFFFF;
      border-radius: 12px;
      padding: 1.25rem 1.5rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      box-shadow: 0 4px 12px rgba(0, 47, 108, 0.16);
      margin-bottom: 1.25rem;
    }

    .exec-banner h1 {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .exec-banner .sub {
      font-size: 0.84rem;
      color: #CBD5E1;
      margin-top: 0.2rem;
    }

    .banner-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.6rem;
    }

    .live-pill {
      background: rgba(22, 163, 74, 0.2);
      border: 1px solid #4ADE80;
      color: #DCFCE7;
      padding: 0.35rem 0.8rem;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4ADE80;
      display: inline-block;
    }

    .header-btn {
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #FFFFFF;
      padding: 0.4rem 0.8rem;
      border-radius: 7px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      text-decoration: none;
      transition: background 0.15s;
    }

    .header-btn:hover { background: rgba(255, 255, 255, 0.25); }

    /* Cards & Pop-out Definition Drawers */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 1.35rem;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.05);
      margin-bottom: 1.25rem;
    }

    .card-header-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.75rem;
      margin-bottom: 0.7rem;
    }

    .def-toggle-btn {
      background: #F1F5F9;
      border: 1px solid #CBD5E1;
      color: var(--wgu-blue);
      padding: 0.28rem 0.65rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      white-space: nowrap;
      flex-shrink: 0;
      transition: background 0.15s, border-color 0.15s;
    }

    .def-toggle-btn:hover {
      background: #EFF6FF;
      border-color: #93C5FD;
    }

    .def-popover {
      background: #F8FAFC;
      border: 1px solid #CBD5E1;
      border-left: 4px solid var(--wgu-gold);
      border-radius: 7px;
      padding: 0.8rem 1rem;
      margin-bottom: 0.9rem;
      font-size: 0.82rem;
      color: #334155;
      line-height: 1.5;
    }

    .def-popover.hidden { display: none; }

    .def-popover dl {
      display: grid;
      grid-template-columns: max-content 1fr;
      gap: 0.35rem 0.85rem;
    }

    @media (max-width: 680px) {
      .def-popover dl { grid-template-columns: 1fr; }
    }

    .def-popover dt {
      font-weight: 700;
      color: var(--wgu-blue);
    }

    .def-popover dd {
      margin: 0;
      color: #334155;
    }

    /* 3-Column Executive Summary Grid (PI Update | Key Bullets | Live Funnel Graphic) */
    .exec-summary-grid {
      display: grid;
      grid-template-columns: 0.95fr 1.2fr 1.25fr;
      gap: 1.15rem;
      align-items: stretch;
    }

    @media (max-width: 1120px) {
      .exec-summary-grid { grid-template-columns: 1fr 1fr; }
      .funnel-panel { grid-column: 1 / -1; }
    }

    @media (max-width: 760px) {
      .exec-summary-grid { grid-template-columns: 1fr; }
    }

    .pi-note-box {
      background: #EFF6FF;
      border: 1px solid #93C5FD;
      border-left: 5px solid var(--wgu-blue);
      border-radius: 8px;
      padding: 0.95rem 1.05rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .section-kicker {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--wgu-blue);
      margin-bottom: 0.45rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .pi-note-text {
      font-size: 0.88rem;
      color: #1E293B;
      line-height: 1.5;
      white-space: pre-line;
    }

    .pi-note-footer {
      font-size: 0.73rem;
      color: var(--text-muted);
      margin-top: 0.65rem;
      padding-top: 0.45rem;
      border-top: 1px solid #BFDBFE;
    }

    .bullets-panel {
      display: flex;
      flex-direction: column;
    }

    .kpi-bullets {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      flex: 1;
      justify-content: space-between;
    }

    .kpi-bullets li {
      background: #F8FAFC;
      border: 1px solid #E2E8F0;
      border-radius: 7px;
      padding: 0.58rem 0.8rem;
      font-size: 0.84rem;
      line-height: 1.4;
    }

    .kpi-lead {
      font-weight: 700;
      color: var(--wgu-blue);
      display: block;
      margin-bottom: 0.12rem;
    }

    .kpi-val {
      color: #1E293B;
      font-weight: 500;
    }

    /* Funnel Panel Styling */
    .funnel-panel {
      background: #F8FAFC;
      border: 1px solid #E2E8F0;
      border-radius: 8px;
      padding: 0.85rem 0.95rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .funnel-svg-wrap {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0.15rem 0;
    }

    .funnel-svg-wrap svg {
      width: 100%;
      height: auto;
      max-height: 225px;
      display: block;
    }

    .funnel-caption {
      font-size: 0.71rem;
      color: var(--text-muted);
      text-align: center;
      margin-top: 0.25rem;
    }

    .exec-footnote {
      font-size: 0.74rem;
      font-style: italic;
      color: var(--text-muted);
      margin-top: 0.85rem;
      padding-top: 0.55rem;
      border-top: 1px solid #E2E8F0;
    }

    /* 2x2 Visualization Grid */
    .charts-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.25rem;
      margin-bottom: 1.25rem;
    }

    @media (max-width: 980px) {
      .charts-grid { grid-template-columns: 1fr; }
    }

    .chart-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 1.15rem 1.25rem;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.05);
    }

    .chart-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--wgu-blue);
      margin-bottom: 0.15rem;
    }

    .chart-subtitle {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .chart-canvas-wrap {
      position: relative;
      height: 245px;
      width: 100%;
    }

    /* Student Drill-Down Section */
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
      margin: 0.75rem 0 1rem 0;
      padding: 0.85rem;
      background: #F8FAFC;
      border: 1px solid #E2E8F0;
      border-radius: 8px;
    }

    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
      min-width: 175px;
    }

    .filter-group label {
      font-size: 0.74rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .filter-group input, .filter-group select {
      padding: 0.42rem 0.65rem;
      border: 1px solid #CBD5E1;
      border-radius: 6px;
      font-size: 0.85rem;
      background: #FFFFFF;
      color: var(--text-main);
    }

    .clear-btn {
      margin-top: 1.05rem;
      padding: 0.44rem 0.85rem;
      border: 1px solid var(--wgu-blue);
      background: #FFFFFF;
      color: var(--wgu-blue);
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
    }

    .clear-btn:hover { background: #EFF6FF; }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid #E2E8F0;
      border-radius: 8px;
      max-height: 360px;
    }

    table.data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
      background: #FFFFFF;
    }

    table.data-table th {
      background: var(--wgu-blue);
      color: #FFFFFF;
      text-align: left;
      padding: 0.55rem 0.7rem;
      position: sticky;
      top: 0;
      z-index: 2;
      white-space: nowrap;
    }

    table.data-table td {
      padding: 0.5rem 0.7rem;
      border-bottom: 1px solid #E2E8F0;
      white-space: nowrap;
    }

    table.data-table tbody tr {
      cursor: pointer;
      transition: background 0.12s;
    }

    table.data-table tbody tr:hover { background: #EFF6FF; }
    table.data-table tbody tr.selected-row { background: #DBEAFE; font-weight: 600; }

    .badge {
      display: inline-block;
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      font-size: 0.74rem;
      font-weight: 700;
    }

    .badge-interv { background: #DBEAFE; color: #1E40AF; }
    .badge-ctrl { background: #F1F5F9; color: #334155; }
    .badge-yes { background: #DCFCE7; color: #166534; }
    .badge-no { background: #FEE2E2; color: #991B1B; }
    .badge-pend { background: #FEF3C7; color: #92400E; }

    .empty-state {
      text-align: center;
      padding: 2rem 1rem;
      color: var(--text-muted);
      font-size: 0.88rem;
    }

    /* Bottom Comprehensive Data Dictionary Drawer */
    details.master-dictionary {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.05);
      overflow: hidden;
    }

    details.master-dictionary summary {
      padding: 1.05rem 1.35rem;
      font-size: 0.98rem;
      font-weight: 700;
      color: var(--wgu-blue);
      cursor: pointer;
      list-style: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #F8FAFC;
    }

    details.master-dictionary summary::-webkit-details-marker { display: none; }

    details.master-dictionary summary:hover { background: #EFF6FF; }

    .dictionary-body {
      padding: 1.25rem 1.35rem 1.5rem 1.35rem;
      border-top: 1px solid #E2E8F0;
      font-size: 0.85rem;
      color: #334155;
    }

    .dict-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 1.1rem;
      margin-top: 0.75rem;
    }

    .dict-group {
      background: #F8FAFC;
      border: 1px solid #E2E8F0;
      border-radius: 8px;
      padding: 0.95rem 1.05rem;
    }

    .dict-group h4 {
      color: var(--wgu-blue);
      font-size: 0.88rem;
      margin-bottom: 0.5rem;
      border-bottom: 1px solid #CBD5E1;
      padding-bottom: 0.3rem;
    }

    .dict-group ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
    }

    .dict-group li strong { color: #0F172A; }

    .footer-note {
      text-align: center;
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: 1.5rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Top Executive Header -->
    <header class="exec-banner">
      <div>
        <h1>D426 Curricular Sequencing Pilot — Operational Telemetry Dashboard</h1>
        <div class="sub">
          <i class="fa-solid fa-shield-halved"></i> Privacy Safeguard Active: Anonymous <code>S26_</code> Study Tokens Only &bull; Zero Institutional Student IDs or PII
        </div>
      </div>
      <div class="banner-actions">
        <span class="live-pill"><span class="live-dot"></span> LIVE READ-ONLY VIEW</span>
        <a href="#full-data-dictionary" class="header-btn" onclick="openMasterDictionary()">
          <i class="fa-solid fa-book-open"></i> Metric Definitions
        </a>
        <button type="button" class="header-btn" onclick="loadDashboardData()">
          <i class="fa-solid fa-rotate"></i> Refresh Feed
        </button>
      </div>
    </header>

    <!-- Top Executive Summary: Manual PI Update | Key Metric Bullets | Live Funnel Graphic -->
    <section class="card">
      <div class="card-header-row">
        <div class="section-kicker" style="margin-bottom:0;"><i class
